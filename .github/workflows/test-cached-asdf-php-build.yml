name: Test cached-asdf PHP build

# Checks that cached-asdf's vendored PHP build dependencies are enough to
# compile every supported PHP minor version with asdf-php. Each build takes
# about 12 minutes, so this only runs when the action changes, or on demand.
#
# It runs the action's dependency script (cached-asdf/php-build-deps.sh) on its
# own instead of the whole action: asdf installs only
# from the root .tool-versions, and the action's cache could skip the step.

on:
  pull_request:
    paths: &paths
      - cached-asdf/action.yml
      - cached-asdf/php-build-deps.sh
      - .github/workflows/test-cached-asdf-php-build.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install PHP build-time dependencies
        run: cached-asdf/php-build-deps.sh

      - name: Install asdf
        uses: asdf-vm/actions/setup@v4

      - name: Build PHP ${{ matrix.php }} with asdf
        id: build
        env:
          PHP_MINOR: ${{ matrix.php }}
        run: |
          asdf plugin add php
          version=$(asdf latest php "$PHP_MINOR")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          asdf install php "$version"

      - name: Check the built PHP
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          php="$(asdf where php "$VERSION")/bin/php"
          "$php" -v
          "$php" -m
          "$php" -r 'exit(function_exists("imagecreatetruecolor") ? 0 : 1);'
          "$php" -r 'var_export(gd_info()); echo PHP_EOL;'
