name: Test cached-asdf

on:
  pull_request:
    paths: &paths
      - cached-asdf/**
      - .github/fixtures/cached-asdf/**
      - .github/workflows/test-cached-asdf.yml
      - .tool-versions
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read
  actions: write # delete earlier cache entries so the cold jobs really run cold

jobs:
  # asdf-vm/actions/install always installs from the root .tool-versions
  # (nodejs only, which downloads a prebuilt binary), so no PHP is compiled in
  # this repository's CI. cold and warm test the cache path without the PHP
  # build dependencies (no apt); php-build-deps passes a fixture requesting PHP
  # as tool-versions-path, which makes the action run its apt step for real.
  cold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Every OS release and every ref: a pull request run also restores main's
      # entries.
      - &delete-cache
        name: Delete the cache entries for this .tool-versions from earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ hashFiles('**/.tool-versions') }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.key | endswith(\"-asdf-$HASH\")) | .id" |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id"; done

      - name: Run cached-asdf
        id: asdf
        uses: ./cached-asdf

      - name: Assert a cold run under a key with the OS release
        env:
          CACHE_HIT: ${{ steps.asdf.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.asdf.outputs.cache-key }}
        run: |
          test "$CACHE_HIT" != "true"
          release=$(. /etc/os-release && echo "$ID-$VERSION_ID")
          case "$CACHE_KEY" in "Linux-X64-$release-asdf-"*) ;; *) echo "Unexpected key $CACHE_KEY"; exit 1 ;; esac
          test "$(node --version)" = "v$(awk '$1 == "nodejs" { print $2 }' .tool-versions)"

      - &assert-saved
        name: Assert the cache was saved before the job ends
        uses: actions/cache/restore@v6
        with:
          path: ~/.asdf/
          key: ${{ steps.asdf.outputs.cache-key }}
          lookup-only: true
          fail-on-cache-miss: true

  warm:
    needs: cold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run cached-asdf
        id: asdf
        uses: ./cached-asdf

      - name: Assert an exact cache hit
        env:
          CACHE_HIT: ${{ steps.asdf.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = "true"
          test "$(node --version)" = "v$(awk '$1 == "nodejs" { print $2 }' .tool-versions)"

  # Runs after warm because it deletes the same cache entry.
  php-build-deps:
    needs: warm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Show apt network settings preset by the runner image
        run: apt-config dump | grep -iE 'retries|timeout' || echo "(none)"

      - name: Probe the Ubuntu mirrors (informational)
        run: |
          for url in $(grep -oE 'https?://[^[:space:]]+' /etc/apt/apt-mirrors.txt 2>/dev/null) http://security.ubuntu.com/ubuntu/; do
            code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$url") || true
            echo "$url -> ${code:-no response}"
          done

      - *delete-cache

      - name: Run cached-asdf
        id: asdf
        uses: ./cached-asdf
        with:
          tool-versions-path: .github/fixtures/cached-asdf/.tool-versions

      - name: Assert the PHP build dependencies are installed
        env:
          CACHE_HIT: ${{ steps.asdf.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" != "true"
          dpkg-query -W libmcrypt-dev libonig-dev libtidy-dev libzip-dev re2c

      - *assert-saved
