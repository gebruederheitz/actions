name: cached-asdf
description: >
  Install asdf and all required languages, caching the languages between workflow runs.
  Installs PHP build-time dependencies when the .tool-versions file requests PHP, and
  optionally sets up go-task.
inputs:
  setup-task:
    description: >
      Whether to set up go-task. Set this to "true" if your workflow requires go-task.
    required: false
    default: "false"
  tool-versions-path:
    description: >
      Path to the .tool-versions file inspected to decide whether build-time
      dependencies (e.g. for PHP) are required.
    required: false
    default: .tool-versions
  repo-token:
    description: >
      (optional) When using "setup-task", pass this GitHub token to `go-task/setup-task`;
      see https://github.com/go-task/setup-task#repo-token
      > Heavy usage of the action can result in workflow run failures caused by 
      > rate limiting. GitHub provides a more generous allowance for Authenticated 
      > API requests.
    required: false
    default: ''
  asdf-version:
    description: >
      The version of asdf to install. Defaults to the latest stable version.
    required: false
    default: 'latest'
outputs:
  cache-hit:
    description: >
      "true" when the asdf cache was restored for the exact .tool-versions hash, in
      which case nothing was installed.
    value: ${{ steps.asdf-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
    - name: Install asdf base
      uses: asdf-vm/actions/setup@v4
      with:
        asdf_version: ${{ inputs.asdf-version }}
    # Restore and save are separate steps (instead of actions/cache) so the
    # compiled languages are saved right after installing them, even if a later
    # step of the job fails. The prefix restore key is deliberate: when only one
    # tool changes (e.g. a Node.js bump), the other compiled languages (PHP) are
    # reused and asdf installs just the missing version.
    - name: Restore asdf cache
      id: asdf-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.asdf/
        key: ${{ runner.os }}-asdf-${{ hashFiles('**/.tool-versions') }}
        restore-keys: |
          ${{ runner.os }}-asdf-
    - name: Check for PHP
      id: check-php
      if: steps.asdf-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TOOL_VERSIONS: ${{ inputs.tool-versions-path }}
      run: |
        if [ -f "$TOOL_VERSIONS" ] && grep -qE '^php[[:space:]]' "$TOOL_VERSIONS"; then
          echo "php-required=true" >> "$GITHUB_OUTPUT"
        else
          echo "php-required=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Install PHP build-time dependencies
      if: steps.asdf-cache.outputs.cache-hit != 'true' && steps.check-php.outputs.php-required == 'true'
      shell: bash
      run: |
        # Debian/Ubuntu package list vendored from php-build's install-dependencies.sh
        # (the `debian|ubuntu)` branch) at php-build/php-build@2fecc9da7425e66307fca0341267a239c4502d25,
        # plus our own libgd-dev. See "Updating the PHP build dependencies" in the README.
        packages=(
          autoconf
          bash
          bison
          build-essential
          ca-certificates
          curl
          findutils
          git
          libbz2-dev
          libcurl4-gnutls-dev
          libicu-dev
          libjpeg-dev
          libmcrypt-dev
          libonig-dev
          libpng-dev
          libreadline-dev
          libsqlite3-dev
          libssl-dev
          libtidy-dev
          libxml2-dev
          libxslt1-dev
          libzip-dev
          pkg-config
          re2c
          zlib1g-dev
          # Not in php-build's list, see the README.
          libgd-dev
        )
        # Bound network waits so an unreachable mirror fails the step within
        # minutes instead of hanging: apt's own retries and timeouts, plus a hard
        # ceiling per command (composite steps cannot set timeout-minutes).
        apt_opts=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
        )
        sudo DEBIAN_FRONTEND=noninteractive timeout 5m apt-get "${apt_opts[@]}" -q update
        sudo DEBIAN_FRONTEND=noninteractive timeout 10m apt-get "${apt_opts[@]}" -q -y \
          --no-install-recommends install "${packages[@]}"
    - name: Install languages if required
      if: steps.asdf-cache.outputs.cache-hit != 'true'
      uses: asdf-vm/actions/install@v4
      with:
        asdf_version: '${{ inputs.asdf-version }}'
        tool_versions_path: '${{ inputs.tool-versions-path }}'
    - name: Save asdf cache
      if: steps.asdf-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.asdf/
        key: ${{ steps.asdf-cache.outputs.cache-primary-key }}
    - name: Setup go-task
      if: inputs.setup-task == 'true'
      uses: go-task/setup-task@v2
      with:
        repo-token: '${{ inputs.repo-token }}'

